# Replace the static site's Nginx server block in Coolify with this config.
# Keep Coolify's generated listen/root values if they differ for your image.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Preserve the old homepage URL with a real HTTP redirect.
    location = /home { return 308 /; }
    location = /home/ { return 308 /; }

    # Canonical URLs have no trailing slash; directories contain index.html.
    location ~ ^(.+)/$ { return 308 $1$is_args$args; }

    # Hashed CSS, scripts and bundled fonts; never apply this to CMS media.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
